<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rad.ish — Mike Radysh</title>
  <meta name="description" content="Personal reference site for an NJIT EE student. Engineering notes, garage log, vehicle guides." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #0b0c0e; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Site data (plain JS, no JSX) -->
  <script src="site-data.js"></script>

  <!--
    Compile + mount the app explicitly.

    We deliberately do NOT use <script type="text/babel"> auto-processing:
    recent @babel/standalone builds default preset-react to the *automatic*
    JSX runtime, which emits `import { jsx } from "react/jsx-runtime"`. That
    import can't run in a plain browser script and fails silently — blank page.
    Forcing runtime:'classic' compiles JSX to React.createElement (no imports).
  -->
  <script>
    (async () => {
      const root = document.getElementById('root');
      try {
        const src = await (await fetch('variant-notebook.jsx')).text();
        const { code } = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] });
        (0, eval)(code); // sets window.VariantNotebook
        const App = window.VariantNotebook;
        if (typeof App !== 'function') throw new Error('VariantNotebook component did not load');
        ReactDOM.createRoot(root).render(React.createElement(App));
      } catch (err) {
        console.error(err);
        root.innerHTML =
          '<pre style="color:#c8634d;font-family:monospace;padding:32px;white-space:pre-wrap;font-size:13px">'
          + 'Failed to load the app:\n\n' + ((err && err.stack) || err) + '</pre>';
      }
    })();
  </script>
</body>
</html>
